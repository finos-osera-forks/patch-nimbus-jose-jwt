    note: "Carried from 9.22.1-backpatch-00004; ported onto 9.22; fixed at 9.22.1-backpatch-00004 (backpatch-nimbus-jose-jwt@6a278c3..6519788). This release ships upstream's switch, in 9.24, from a shaded json-smart to a shaded Gson, with upstream's later repairs of that switch and its raise to Gson 2.12.1, whose parser refuses JSON nested deeper than 255 levels (upstream commits 74a64ad6, 04bd9c1e, 393a96fd, ed736420, 12494b6e and dbd5de40). The shaded packages com.nimbusds.jose.shaded.json, com.nimbusds.jose.shaded.asm and com.nimbusds.jose.shaded.ow2asm are gone, so code that uses them no longer compiles or links against this release. JSON objects are parsed strictly: unquoted keys or values and trailing commas are refused, and every parse failure reads \"Invalid JSON object\". Parsed numbers are Gson's types, so a whole number in a header or claims set that came back as a Long or Integer now comes back as a Double."
